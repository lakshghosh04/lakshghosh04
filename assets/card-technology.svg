<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img"><title>Technology: Use it where it fits. Practical AI, where it earns its place.</title><defs>
<linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.14"/><stop offset="1" stop-color="#fff" stop-opacity="0.03"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.6"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.15"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#aab4c2"/></linearGradient>
<radialGradient id="b1"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0.5"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#9B8CFF" stop-opacity="0.45"/><stop offset="1" stop-color="#9B8CFF" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect width="400" height="300" rx="34"/></clipPath>
</defs><rect width="400" height="300" rx="34" fill="#0E131B" fill-opacity="0.8"/>
<g clip-path="url(#clip)">
<circle r="180.0" fill="url(#b1)" cx="80.0" cy="90.0">
<animate attributeName="cx" values="80.0;200.0;80.0" dur="19s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
<animate attributeName="cy" values="90.0;225.0;90.0" dur="19s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
</circle>
<circle r="180.0" fill="url(#b2)" cx="340.0" cy="225.0">
<animate attributeName="cx" values="340.0;220.00000000000003;340.0" dur="23s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
<animate attributeName="cy" values="225.0;90.0;225.0" dur="23s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
</circle>
</g>
<rect width="400" height="300" rx="34" fill="url(#fill)"/>
<rect x="34" y="1.5" width="332" height="1.5" fill="url(#sheen)" opacity="0.9"/>
<g clip-path="url(#clip)">
<rect x="-160.0" y="0" width="140.0" height="300" fill="url(#sheen)" transform="skewX(-20)">
<animate attributeName="x" values="-160.0;480.0;480.0" keyTimes="0;0.4;1" keySplines=".4 0 .2 1;0 0 1 1" calcMode="spline" dur="13s" repeatCount="indefinite"/>
</rect>
</g>
<rect x="0.75" y="0.75" width="398.5" height="298.5" rx="33.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/><g transform="translate(176 52) scale(2)"><g fill="none" stroke="#F5F5F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
<animateTransform attributeName="transform" type="translate" values="0 0;0 -2.5;0 0" dur="5s" begin="2.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
<rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></g></g>
<text x="200" y="176" text-anchor="middle" font-family="Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="url(#metal)">Technology</text>
<text x="200" y="214" text-anchor="middle" font-family="Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#F5F5F7" fill-opacity="0.92">Use it where it fits.</text>
<text x="200" y="246" text-anchor="middle" font-family="Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9AA3AE">Practical AI, where it earns its place.</text></svg>